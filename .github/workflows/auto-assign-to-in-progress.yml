name: Move assigned issues to In Progress

on:
  issues:
    types: [assigned]

jobs:
  move-to-in-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to In Progress
        uses: alex-page/github-project-automation-plus@v0.8.3
        with:
          project: "ROADMAP"
          column: "In Progress"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
